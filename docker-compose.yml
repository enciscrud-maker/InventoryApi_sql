services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: inventory-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:-Your_strong_Passw0rd}"
    ports:
      - "${SQL_HOST_PORT:-1434}:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory-api
    depends_on:
      sql:
        condition: service_healthy
    restart: on-failure
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__DefaultConnection: "Server=sql,1433;Database=${DATABASE_NAME:-InventoryApiDocker};User Id=sa;Password=${SA_PASSWORD:-Your_strong_Passw0rd};TrustServerCertificate=True;Encrypt=False"
      Jwt__Key: "${JWT_KEY:-CHANGE-ME-dev-only-key-at-least-32-characters-long!}"
      Swagger__Enabled: "true"
      Seed__SampleData: "false"
      Seed__AdminPassword: "${ADMIN_PASSWORD:-Admin#12345}"
      Storage__RootPath: "/app/uploads"
      Cors__Origins__0: "http://localhost:3000"
      Cors__Origins__1: "http://10.30.203.151:3000"
    volumes:
      - uploads:/app/uploads

volumes:
  sqldata:
  uploads:
